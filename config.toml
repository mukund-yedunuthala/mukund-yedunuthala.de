# The URL the site will be built for
theme = "tabi"
base_url = "https://mukundyedunuthala.page"
title = "Mukund Yedunuthala"
description = "Computational Engineer | Numerical Modeling and High-Performance Computing (HPC) Expert"
generate_feeds = false
compile_sass = true
minify_html = true
default_language = "en"

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true
taxonomies = [{ name = "tags", feed = false }]

[search]
index_format = "elasticlunr_json"
include_title = true
include_description = true
include_path = true
include_content = true

[markdown.highlighting]
theme = "catppuccin-frappe"
style = "class"
smart_punctuation = true
bottom_footnotes = true

[link_checker]
internal_level = "warn"

[languages.de]
title = "Mukund Yedunuthala"
description =  "Computational Engineer | Numerical Modeling and High-Performance Computing (HPC) Expert"
taxonomies = [{ name = "tags", feed = false }]


[extra]
language_name.en = "English"
language_name.de = "Deutsch"
base_canonical_url = "https://mukundyedunuthala.page"
social_media_card = "img/social_cards/index.jpg"
theme_switcher = true
default_theme = "dark"
skin = "blue"
favicon = "img/favicon.svg"
headerImage = "img/me.webp"
remote_repository_url = "https://github.com/mukund-yedunuthala/mukundyedunuthala.page"
remote_repository_git_platform = "github"
remote_repository_branch = "master"
show_remote_changes = true
show_remote_source = true
copy_button = true
show_reading_time = false
katex = true
mermaid = false
quick_navigation_buttons = true
toc = true
long_date_format = "%d %B %Y"
invert_title_order = true
menu = [
    { name = "About", url = "about", trailing_slash = true },
    { name = "Projects", url = "projects", trailing_slash = true },
    # { name = "Tags", url = "tags", trailing_slash = true },
    { name = "Blog", url = "blog", trailing_slash = true },
]
footer_menu = [
    { url = "imprint", name = "Imprint", trailing_slash = true },
    { url = "privacy-policy", name = "Privacy policy", trailing_slash = true },
    { url = "sitemap.xml", name = "Sitemap", trailing_slash = false },
]
allowed_domains = [
    { directive = "font-src", domains = [
        "'self'",
        "data:",
    ] },
    { directive = "img-src", domains = [
        "'self'",
        "https://*",
        "data:",
    ] },
    { directive = "script-src", domains = [
        "'self'",
    ] },
    { directive = "style-src", domains = [
        "'self'",
    ] },
    { directive = "frame-src", domains = [
        "player.vimeo.com",
        "https://www.youtube-nocookie.com",
    ] },
]

bloglist_date = "both"
email = "mukundkashyapyn@outlook.com"
encode_plaintext_email = true
socials = [
    { name = "GitHub", url = "https://github.com/mukund-yedunuthala/", icon = "github" },
    { name = "GitLab", url = "https://gitlab.com/mukund-yedunuthala/", icon = "gitlab" },
    { name = "LinkedIn", url = "https://www.linkedin.com/in/mukund-yedunuthala/", icon = "linkedin" },
    { name = "Pixelfed", url = "https://pixelfed.social/mukskashyap", icon = "pixelfed" },
    { name = "Mastodon", url = "https://convo.casa/@mukskashyap", icon = "mastodon" },
]
fediverse_creator = { handle = "mukskashyap", domain = "convo.casa" }
